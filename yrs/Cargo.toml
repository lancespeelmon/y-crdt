[package]
name = "yrs"
version = "0.28.1"
description = "High performance implementation of the Yjs CRDT"
license = "MIT"
authors = ["Kevin Jahns <kevin.jahns@pm.me>", "Bartosz Sypytkowski <b.sypytkowski@gmail.com>"]
keywords = ["crdt", "yrs"]
edition = "2021"
rust-version = "1.85"
homepage = "https://github.com/y-crdt/y-crdt/"
repository = "https://github.com/y-crdt/y-crdt/"
readme = "./README.md"

[features]
default = ["sync", "protocol"]
weak = []
sync = []
protocol = ["dep:dashmap", "dep:async-trait"]
tracing = ["dep:tracing"]

[dependencies]
thiserror = "2"
fastrand = { version = "2", features = ["js"] }
smallstr = { version = "0.3", features = ["union"] }
smallvec = { version = "1.16", features = ["union", "const_generics", "const_new"] }
async-lock = "3.4"
async-trait = { version = "0.1", optional = true }
arc-swap = "1.9"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
dashmap = { version = "6.2", optional = true }
indexmap = "2.5"
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
dhat = "0.3"
criterion = "0.8"
flate2 = "1"
ropey = "1.6.0"
proptest = "1.11"
proptest-derive = "0.8.0"
assert_matches2 = "0.1"
uuid = "1.26"

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "id_set"
harness = false

[[bench]]
name = "text_utf16"
harness = false

[[bench]]
name = "serialization"
harness = false

[lib]
doctest = true
# Criterion benches live in benches/; the lib has none, and its test harness rejects their flags.
bench = false
doc = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
