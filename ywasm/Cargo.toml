[package]
name = "ywasm"
version = "0.28.1"
authors = ["Kevin Jahns <kevin.jahns@protonmail.com>", "Bartosz Sypytkowski <b.sypytkowski@gmail.com>"]
keywords = ["crdt", "wasm", "yrs"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "High performance implementation of the Yjs CRDT"
homepage = "https://github.com/yjs/y-crdt/"
repository = "https://github.com/yjs/y-crdt/"
readme = "./README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# `js` seeds client IDs from the JS crypto API; without it every document would get the same one.
yrs = { path = "../yrs", version = "0.28.1", default-features = false, features = ["weak", "protocol", "js"] }
ybindings-core = { path = "../ybindings-core", version = "0.28.1" }
wasm-bindgen = { version = "0.2" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde-wasm-bindgen = "0.6"
base64_light = "0.1"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

js-sys = "0.3"

[dev-dependencies]

# Smallest output: browsers download this module, and CI holds it to a size budget.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints]
workspace = true
