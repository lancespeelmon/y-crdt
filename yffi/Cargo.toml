[package]
name = "yffi"
version = "0.28.1"
authors = ["Kevin Jahns <kevin.jahns@protonmail.com>", "Bartosz Sypytkowski <b.sypytkowski@gmail.com>"]
keywords = ["crdt", "c-ffi", "yrs"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Bindings for the Yrs native C foreign function interface"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]

[dependencies]
yrs = { path = "../yrs", version = "0.28.1", features = ["weak"] }
ybindings-core = { path = "../ybindings-core" }
serde_json = { version = "1.0" }

[lib]
crate-type = ["staticlib", "cdylib"]
name = "yrs"

[lints]
workspace = true
