on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Release packages

permissions:
  contents: read

jobs:
  dist:
    name: create ${{ matrix.target }} C-FFI distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [ x86_64-linux, aarch64-macos, x86_64-windows ]
        include:
          - build: x86_64-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libyrs.so
          - build: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libyrs.dylib
          - build: x86_64-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: yrs.dll
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: install cbindgen
        run: cargo install cbindgen
      - name: build release binary
        run: cargo build -p yffi --release --locked --target ${{ matrix.target }}
      - name: Strip release binary (linux and macos)
        if: matrix.build == 'x86_64-linux' || matrix.build == 'aarch64-macos'
        run: strip -x "./target/${{ matrix.target }}/release/${{ matrix.lib_name }}"
      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" "dist/"
      - name: generate C bindings
        run: cbindgen --config ./yffi/cbindgen.toml --crate yffi --output "dist/libyrs.h" --lang C
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins-${{ matrix.build }}
          path: dist

  release:
    name: release
    needs: [ dist ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload binaries to it
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: ls -al bins-*
      - name: Calculate tag name
        run: |
          name=dev
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name=${GITHUB_REF:10}
          fi
          echo "val=$name" >> "$GITHUB_OUTPUT"
          echo "TAG=$name" >> "$GITHUB_ENV"
        id: tagname
      - name: Build archive
        shell: bash
        run: |
          set -ex

          rm -rf tmp
          mkdir tmp
          mkdir dist

          for dir in bins-* ; do
              platform=${dir#"bins-"}
              unset exe
              if [[ $platform =~ "windows" ]]; then
                  exe=".exe"
              fi
              pkgname="yffi-$TAG-$platform"
              mkdir "tmp/$pkgname"
              # cp LICENSE README.md tmp/$pkgname
              mv "bins-$platform"/* "tmp/$pkgname/"

              if [ "$exe" = "" ]; then
                  tar cJf "dist/$pkgname.tar.xz" -C tmp "$pkgname"
              else
                  (cd tmp && 7z a -r "../dist/$pkgname.zip" "$pkgname")
              fi
          done
      - name: Upload binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tagname.outputs.val }}
        run: |
          set -e
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "" --verify-tag
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Extract version
        id: extract-version
        run: |
          printf "val=%s\n" "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  publish-crate:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: cargo publish yrs
        run: cd ./yrs && cargo publish --all-features --token "${CRATES_TOKEN}"
        env:
          CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: cargo publish yffi
        run: sleep 20 && cd ./yffi && cargo publish --token "${CRATES_TOKEN}"
        env:
          CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: publish to npmjs.org
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: install nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'

      - name: build wasm
        run: wasm-pack build --release --target nodejs ./ywasm

      - name: npm publish
        run: cd ./ywasm/pkg && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
