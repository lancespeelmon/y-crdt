name: Main

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]
  # Called by release.yml so a tag is only published after the full suite passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned by commit SHA; the trailing comment names the release.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Latest stable rustfmt. Formatting can change between Rust releases (1.100 started
      # splitting macro arguments onto separate lines), so reformat after a toolchain bump.
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [ '', '--all-features', '--no-default-features' ]
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned: the allow list in the root Cargo.toml was taken with this clippy, and a newer
      # clippy adds lints that would otherwise break CI on a toolchain release.
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

      - name: rustdoc
        run: cargo doc -p yrs --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # The libraries must build on the `rust-version` they declare. Dev-dependencies (criterion)
    # need a newer toolchain, so only the library targets are checked.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [ '', '--all-features' ]
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: check
        run: cargo check -p yrs -p yffi ${{ matrix.features }}

      - name: check ywasm
        run: cargo check -p ywasm --target wasm32-unknown-unknown ${{ matrix.features }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licenses, banned crates and allowed sources, configured in deny.toml.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build-yrs:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: build default
        run: cargo build --verbose --release -p yrs -p yffi

  test-yrs:
    runs-on: ${{ matrix.os }}
    needs: build-yrs
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: test default
        run: cargo test --release -p yrs

      - name: test all
        run: cargo test --release --all-features -p yrs

  bench-smoke:
    runs-on: ubuntu-latest
    needs: build-yrs
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Runs every benchmark once (criterion test mode) so the harness itself can't rot. The bench
      # profile inherits the release profile's fat LTO, which a single run doesn't need.
      - name: run benchmarks in test mode
        env:
          CARGO_PROFILE_BENCH_LTO: 'false'
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: '16'
        run: cargo bench -p yrs -- --test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: measure line coverage
        run: cargo llvm-cov -p yrs --all-features --json --summary-only --output-path coverage.json

      # Fails if a module's line coverage drops below .github/coverage/floor.json.
      - name: coverage ratchet
        run: python3 .github/coverage/ratchet.py coverage.json

  yjs-compat:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: install pinned yjs
        run: cd ./tests-compat && npm ci

      # Fixtures are generated deterministically, so regenerating must not change them.
      - name: check Yjs fixtures are up to date
        run: |
          cd ./tests-compat && npm run gen
          git diff --exit-code -- ../yrs/tests/fixtures || {
            echo "::error::yrs/tests/fixtures is stale; run 'npm run gen' in tests-compat"
            exit 1
          }

      - name: decode Yjs fixtures with yrs
        env:
          YRS_COMPAT_OUT: ${{ runner.temp }}/yrs-output.json
        run: cargo test -p yrs --all-features --test yjs_compat

      - name: decode yrs output with Yjs
        run: node ./tests-compat/check-yrs-output.mjs "${{ runner.temp }}/yrs-output.json"

  wasm:
    runs-on: ubuntu-latest
    needs: build-yrs
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'

      - name: build wasm
        run: wasm-pack build --release --target nodejs ./ywasm

      # 1,167,242 bytes when set. Raise it in the change that needs more, not to make CI pass.
      - name: wasm size budget
        run: |
          size=$(stat -c %s ywasm/pkg/ywasm_bg.wasm)
          echo "ywasm_bg.wasm: $size bytes (budget 1250000)"
          test "$size" -le 1250000

      - name: test web assembly
        run: cd ./tests-wasm && npm i && npm test

  c-ffi:
    runs-on: ubuntu-latest
    needs: build-yrs
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: none
            cxx_flags: ''
          # ASan intercepts malloc/free for the whole process, so it also catches heap misuse of
          # memory allocated on the Rust side of the C API.
          - sanitizer: asan-ubsan
            cxx_flags: '-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined'
    name: c-ffi (${{ matrix.sanitizer }})
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      # The header is checked in, so fail when it no longer matches the Rust source.
      - name: check C header is up to date
        run: |
          cbindgen --config ./yffi/cbindgen.toml --crate yffi --output ./tests-ffi/include/libyrs.h --lang C
          git diff --exit-code -- tests-ffi/include/libyrs.h || {
            echo "::error::tests-ffi/include/libyrs.h is stale; regenerate it with cbindgen 0.29.4"
            exit 1
          }

      - name: install cmake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      - name: build libyrs
        run: cargo build -p yffi

      - name: generate Makefile
        run: >-
          mkdir ./tests-ffi/cmake-build-debug && cd ./tests-ffi &&
          cmake -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.cxx_flags }}" .

      - name: build c-ffi test project
        run: cd ./tests-ffi && make all

      # Leak detection stays off for now: the C API has known leaks (e.g. ytransaction_subdocs
      # results cannot be freed) that are tracked separately.
      - name: run tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./tests-ffi/yrs-ffi-tests
